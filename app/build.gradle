apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.1"

    defaultConfig {
        applicationId "com.example.ccssend5"
        minSdkVersion 15
        targetSdkVersion 30
        versionCode 2
        versionName "V1T9202510161050"// V1T9202508061430 总公司版本号
//        versionName "D1T9202510141030" //D1T9202506201600 代理商版本号
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

//    splits {
//        abi {
//            enable true
//            reset()
//            include  //select ABIs to build APKs for
//            universalApk true //generate an additional APK that contains all the ABIs
//        }
//    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                //在这里修改apk文件名，引号内的字符串都可以随便定义  ccs5v52  ccs5v01
                outputFileName = "ccs5v01.apk"
            }
    }

    signingConfigs {
        release {
            keyAlias 'ccs5v'
            keyPassword '123456'
            storeFile file('D:/lijin/Key/androidstudio/release/ccs.keystore')
            storePassword '123456'
        }

        compileOptions {
            //将Java环境设置为1.8
            sourceCompatibility = 1.8
            targetCompatibility = 1.8
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation project(path: ':PrinterService')
    implementation files('libs\\TSPL_V1.22.jar')
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.0.1'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
    implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.4@aar'

}
